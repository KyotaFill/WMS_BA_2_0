name: Validate WMS design

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_artifacts.py

  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['15', '16']
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: wms_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: wms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wms_test -d wms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: wms_test
      PGPASSWORD: local-ci-only
      PGDATABASE: wms_test
    steps:
      - uses: actions/checkout@v4
      - name: Create schema and seed
        run: |
          psql -X -v ON_ERROR_STOP=1 -f 02_CSDL/001_schema.sql
          psql -X -v ON_ERROR_STOP=1 -f 02_CSDL/002_seed_permissions.sql
      - name: Check constraints and append-only triggers
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/schema_smoke.sql
      - name: Reconcile empty database after fixture rollback
        run: |
          psql -X -qAt -v ON_ERROR_STOP=1 -f 02_CSDL/reconcile.sql > /tmp/wms-reconcile.txt
          test ! -s /tmp/wms-reconcile.txt
