<text x="1250.0" y="343" font-family="Tinos,Times New Roman,serif" font-size="14" text-anchor="middle" fill="#19344b">3. BEGIN; serialize idempotency key</text>
<rect x="1084.26171875" y="398" width="331.4765625" height="25" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.3"/>
<text x="1250.0" y="418" font-family="Tinos,Times New Roman,serif" font-size="14" text-anchor="middle" fill="#19344b">4. Check quyền, khóa document / period / location</text>
