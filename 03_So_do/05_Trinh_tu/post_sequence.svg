<text x="1250.0" y="568" font-family="Tinos,Times New Roman,serif" font-size="14" text-anchor="middle" fill="#19344b">6a. Không hợp lệ: ROLLBACK</text>
<rect x="681.0234375" y="623" width="277.953125" height="25" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.3"/>
<text x="820.0" y="643" font-family="Tinos,Times New Roman,serif" font-size="14" text-anchor="middle" fill="#19344b">6b. Trả lỗi có mã; giữ nội dung đang nhập</text>
<rect x="1073.9921875" y="698" width="352.015625" height="25" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.3"/>
<text x="1250.0" y="718" font-family="Tinos,Times New Roman,serif" font-size="14" text-anchor="middle" fill="#19344b">7a. Hợp lệ: ledger + balance + audit + outbox + result</text>
