<text x="820.0" y="1018" font-family="Tinos,Times New Roman,serif" font-size="14" text-anchor="middle" fill="#19344b">10. Trả kết quả hoặc NOT_FOUND; retry vẫn cùng key</text>
<text x="35" y="1158" font-family="Tinos,Times New Roman,serif" font-size="13" text-anchor="start" fill="#6b7b8c">6a-6b là nhánh lỗi; 7a-8 là nhánh hợp lệ. Chỉ báo POSTED sau COMMIT. NOT_FOUND không cho phép đổi key.</text>
